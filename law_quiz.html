<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบกฎหมาย เทอม 2</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f472b6;
    --pink-light: #fce7f3;
    --pink-mid: #fbcfe8;
    --purple: #a855f7;
    --purple-light: #f3e8ff;
    --yellow: #fbbf24;
    --yellow-light: #fef3c7;
    --green: #34d399;
    --green-light: #d1fae5;
    --red: #f87171;
    --red-light: #fee2e2;
    --white: #fff;
    --text: #1e1b4b;
    --bg: #fdf4ff;
    --card: #fff;
    --border: #e9d5ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Mitr', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px 0;
    background-image:
      radial-gradient(circle at 10% 10%, #fce7f3 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #f3e8ff 0%, transparent 40%);
  }

  header {
    background: linear-gradient(135deg, #f472b6 0%, #a855f7 100%);
    color: white;
    text-align: center;
    padding: 36px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '⭐';
    font-size: 80px;
    position: absolute;
    left: -20px;
    top: -10px;
    opacity: 0.15;
    transform: rotate(-20deg);
  }
  header::after {
    content: '🌸';
    font-size: 70px;
    position: absolute;
    right: -10px;
    bottom: -15px;
    opacity: 0.18;
    transform: rotate(15deg);
  }
  header h1 {
    font-family: 'Kanit', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header p {
    margin-top: 8px;
    font-size: 0.95rem;
    opacity: 0.88;
  }

  .score-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 18px 20px;
    background: white;
    border-bottom: 2px dashed var(--pink-mid);
    flex-wrap: wrap;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    background: var(--pink-light);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 500;
    color: #be185d;
    border: 1.5px solid var(--pink-mid);
    transition: all 0.3s;
  }
  .score-pill.correct { background: var(--green-light); color: #065f46; border-color: #a7f3d0; }
  .score-pill.wrong { background: var(--red-light); color: #991b1b; border-color: #fca5a5; }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 28px 16px;
  }

  .chapter-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Kanit', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #7c3aed;
    margin: 32px 0 16px;
    padding: 10px 18px;
    background: var(--purple-light);
    border-radius: 12px;
    border-left: 5px solid #a855f7;
  }

  .question-card {
    background: white;
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px rgba(168,85,247,0.07);
    border: 1.5px solid var(--border);
    transition: box-shadow 0.2s;
    position: relative;
  }
  .question-card:hover { box-shadow: 0 4px 24px rgba(168,85,247,0.12); }

  .q-number {
    display: inline-block;
    background: linear-gradient(135deg, #f472b6, #a855f7);
    color: white;
    font-size: 0.78rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .q-text {
    font-size: 1.02rem;
    font-weight: 500;
    line-height: 1.65;
    margin-bottom: 14px;
    color: #1e1b4b;
  }

  .options { display: flex; flex-direction: column; gap: 9px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 11px 16px;
    border-radius: 12px;
    border: 2px solid #e9d5ff;
    cursor: pointer;
    font-size: 0.95rem;
    background: #fafafa;
    transition: all 0.18s;
    user-select: none;
    line-height: 1.5;
  }
  .option:hover { border-color: #c084fc; background: var(--purple-light); }
  .option.selected { border-color: #a855f7; background: var(--purple-light); }
  .option.correct { border-color: #10b981; background: var(--green-light); color: #065f46; font-weight: 500; }
  .option.wrong { border-color: #ef4444; background: var(--red-light); color: #991b1b; }
  .option.reveal-correct { border-color: #10b981; background: var(--green-light); color: #065f46; font-weight: 500; }

  .option-letter {
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #e9d5ff;
    color: #7c3aed;
    font-weight: 700;
    font-size: 0.82rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .option.correct .option-letter { background: #10b981; color: white; }
  .option.wrong .option-letter { background: #ef4444; color: white; }
  .option.reveal-correct .option-letter { background: #10b981; color: white; }

  .check-btn {
    margin-top: 14px;
    padding: 9px 24px;
    background: linear-gradient(135deg, #f472b6, #a855f7);
    color: white;
    border: none;
    border-radius: 999px;
    font-family: 'Mitr', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 2px 10px rgba(168,85,247,0.25);
  }
  .check-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .check-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  .feedback {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.93rem;
    line-height: 1.6;
    display: none;
    animation: fadeIn 0.3s;
  }
  .feedback.correct-fb {
    background: var(--green-light);
    border: 1.5px solid #6ee7b7;
    color: #065f46;
    display: block;
  }
  .feedback.wrong-fb {
    background: var(--red-light);
    border: 1.5px solid #fca5a5;
    color: #991b1b;
    display: block;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .result-section {
    display: none;
    text-align: center;
    margin: 40px 0 20px;
    padding: 36px 28px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 4px 32px rgba(168,85,247,0.13);
    border: 2px solid var(--border);
    animation: fadeIn 0.5s;
  }
  .result-section.show { display: block; }
  .result-emoji { font-size: 3.5rem; margin-bottom: 12px; }
  .result-score { font-family: 'Kanit', sans-serif; font-size: 2.8rem; font-weight: 700; color: #a855f7; }
  .result-label { font-size: 1.1rem; color: #6d28d9; margin-top: 4px; }
  .result-msg { margin-top: 14px; font-size: 0.98rem; color: #64748b; }

  .action-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 11px 28px;
    border-radius: 999px;
    font-family: 'Mitr', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .action-btn.primary {
    background: linear-gradient(135deg, #f472b6, #a855f7);
    color: white;
    box-shadow: 0 2px 12px rgba(168,85,247,0.3);
  }
  .action-btn.secondary {
    background: white;
    color: #a855f7;
    border: 2px solid #a855f7;
  }
  .action-btn:hover { opacity: 0.85; transform: translateY(-2px); }

  .answer-key-section {
    display: none;
    margin-top: 40px;
  }
  .answer-key-section.show { display: block; }
  .answer-key-title {
    font-family: 'Kanit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #f472b6, #a855f7);
    border-radius: 16px;
    padding: 14px 24px;
    margin-bottom: 20px;
    text-align: center;
  }
  .answer-item {
    background: white;
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-left: 5px solid #a855f7;
    box-shadow: 0 2px 10px rgba(168,85,247,0.07);
  }
  .answer-item .q-ref { font-size: 0.82rem; color: #a855f7; font-weight: 600; margin-bottom: 4px; }
  .answer-item .q-ans { font-size: 0.95rem; line-height: 1.6; color: #1e1b4b; }
  .answer-item .correct-mark {
    display: inline-block;
    background: #10b981;
    color: white;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 2px 10px;
    margin-left: 6px;
  }

  .progress-bar-wrap {
    height: 6px;
    background: #f3e8ff;
    border-radius: 999px;
    margin: 0 0 24px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f472b6, #a855f7);
    border-radius: 999px;
    transition: width 0.4s;
  }

  .star-tag {
    display: inline-block;
    background: var(--yellow-light);
    color: #92400e;
    border-radius: 8px;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 2px 10px;
    margin-left: 8px;
    border: 1px solid #fcd34d;
  }
</style>
</head>
<body>

<header>
  <h1>📚 ข้อสอบกฎหมาย เทอม 2</h1>
  <p>ทรัพย์สินทางปัญญา · สัญญาจ้าง · ภาษีอากร · พ.ร.บ. คอมพิวเตอร์</p>
</header>

<div class="score-bar">
  <div class="score-pill" id="pill-total">📝 ทั้งหมด <span id="total-count">0</span> ข้อ</div>
  <div class="score-pill correct" id="pill-correct">✅ ถูก <span id="correct-count">0</span></div>
  <div class="score-pill wrong" id="pill-wrong">❌ ผิด <span id="wrong-count">0</span></div>
</div>

<div class="container" id="quiz-container"></div>

<div class="container">
  <div class="action-row" id="submit-row" style="display:none;">
    <button class="action-btn primary" onclick="submitAll()">🎯 ส่งคำตอบทั้งหมด</button>
    <button class="action-btn secondary" onclick="showAnswerKey()">📋 ดูเฉลย</button>
  </div>

  <div class="result-section" id="result-section">
    <div class="result-emoji" id="result-emoji">🌸</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-label">คะแนนของคุณ</div>
    <div class="result-msg" id="result-msg"></div>
    <div class="action-row">
      <button class="action-btn primary" onclick="resetQuiz()">🔄 ทำใหม่อีกครั้ง</button>
      <button class="action-btn secondary" onclick="toggleAnswerKey()">📋 ดู/ซ่อนเฉลย</button>
    </div>
  </div>

  <div class="answer-key-section" id="answer-key"></div>
</div>

let answered = {};
let correct = 0;
let wrong = 0;
let answerKeyVisible = false;

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let currentChapter = '';
  let totalQ = quizData.length;
  document.getElementById('total-count').textContent = totalQ;

  quizData.forEach((item, idx) => {
    if (item.chapter && item.chapter !== currentChapter) {
      currentChapter = item.chapter;
      const ch = document.createElement('div');
      ch.className = 'chapter-title';
      ch.textContent = item.chapter;
      container.appendChild(ch);
    }
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${idx}`;

    let optionsHtml = item.options.map((opt, oi) => {
      const letters = ['ก', 'ข', 'ค', 'ง'];
      return `<div class="option" id="opt-${idx}-${oi}" onclick="selectOption(${idx}, ${oi})">
        <span class="option-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </div>`;
    }).join('');

    card.innerHTML = `
      <span class="q-number">ข้อที่ ${idx+1}</span>
      <div class="q-text">${item.q}</div>
      <div class="options">${optionsHtml}</div>
      <button class="check-btn" id="btn-${idx}" onclick="checkAnswer(${idx})" disabled>ตรวจคำตอบ</button>
      <div class="feedback" id="fb-${idx}"></div>
    `;
    container.appendChild(card);
  });

  document.getElementById('submit-row').style.display = 'flex';
}

function selectOption(qIdx, oIdx) {
  if (answered[qIdx] !== undefined) return;
  const letters = ['ก', 'ข', 'ค', 'ง'];
  quizData[qIdx].options.forEach((_, oi) => {
    const el = document.getElementById(`opt-${qIdx}-${oi}`);
    el.classList.remove('selected');
  });
  document.getElementById(`opt-${qIdx}-${oIdx}`).classList.add('selected');
  answered[qIdx] = oIdx;
  document.getElementById(`btn-${qIdx}`).disabled = false;
  updateProgress();
}

function checkAnswer(qIdx) {
  const item = quizData[qIdx];
  const chosen = answered[qIdx];
  if (chosen === undefined) return;
  const btn = document.getElementById(`btn-${qIdx}`);
  btn.disabled = true;
  const fb = document.getElementById(`fb-${qIdx}`);

  for (let oi = 0; oi < item.options.length; oi++) {
    const el = document.getElementById(`opt-${qIdx}-${oi}`);
    el.style.pointerEvents = 'none';
    if (oi === item.answer) el.classList.add(chosen === item.answer ? 'correct' : 'reveal-correct');
    else if (oi === chosen && chosen !== item.answer) el.classList.add('wrong');
    else el.classList.remove('selected');
  }

  if (chosen === item.answer) {
    fb.className = 'feedback correct-fb';
    fb.innerHTML = `✅ <strong>ถูกต้อง!</strong> ${item.explain}`;
    correct++;
  } else {
    fb.className = 'feedback wrong-fb';
    const letters = ['ก', 'ข', 'ค', 'ง'];
    fb.innerHTML = `❌ <strong>ผิด!</strong> เฉลย: ข้อ ${letters[item.answer]} - ${item.options[item.answer]}<br>${item.explain}`;
    wrong++;
  }
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
}

function submitAll() {
  // Check all unanswered
  quizData.forEach((item, idx) => {
    if (answered[idx] === undefined) {
      answered[idx] = -1;
    }
    if (document.getElementById(`btn-${idx}`).disabled === false) {
      checkAnswer(idx);
    }
  });
  // Count all
  correct = 0; wrong = 0;
  quizData.forEach((item, idx) => {
    if (answered[idx] === item.answer) correct++;
    else wrong++;
  });
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
  showResult();
}

function showResult() {
  const total = quizData.length;
  const pct = Math.round(correct / total * 100);
  let emoji = pct >= 80 ? '🌸' : pct >= 60 ? '😊' : '😅';
  let msg = pct >= 80 ? 'เยี่ยมมาก! พร้อมสอบแล้ว 💪' : pct >= 60 ? 'ดีมาก! ทบทวนอีกนิดนึงนะ 📚' : 'สู้ๆ! อ่านเพิ่มอีกหน่อยนะ 💕';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-score').textContent = `${correct} / ${total}`;
  document.getElementById('result-msg').textContent = `${pct}% — ${msg}`;
  document.getElementById('result-section').classList.add('show');
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
  document.getElementById('submit-row').style.display = 'none';
}

function resetQuiz() {
  answered = {};
  correct = 0;
  wrong = 0;
  document.getElementById('correct-count').textContent = '0';
  document.getElementById('wrong-count').textContent = '0';
  document.getElementById('result-section').classList.remove('show');
  document.getElementById('answer-key').classList.remove('show');
  answerKeyVisible = false;
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAnswerKey() {
  answerKeyVisible = !answerKeyVisible;
  if (answerKeyVisible) showAnswerKey();
  else document.getElementById('answer-key').classList.remove('show');
}

function showAnswerKey() {
  answerKeyVisible = true;
  const ak = document.getElementById('answer-key');
  const letters = ['ก', 'ข', 'ค', 'ง'];
  let html = `<div class="answer-key-title">📋 เฉลยทุกข้อ</div>`;
  quizData.forEach((item, idx) => {
    html += `<div class="answer-item">
      <div class="q-ref">ข้อที่ ${idx+1}</div>
      <div class="q-ans">❓ ${item.q}</div>
      <div class="q-ans" style="margin-top:6px;">✅ เฉลย: <strong>ข้อ ${letters[item.answer]} — ${item.options[item.answer]}</strong></div>
      <div class="q-ans" style="margin-top:4px;color:#64748b;font-size:0.88rem;">💡 ${item.explain}</div>
    </div>`;
  });
  ak.innerHTML = html;
  ak.classList.add('show');
  ak.scrollIntoView({ behavior: 'smooth' });
}

function updateProgress() {
  const done = Object.keys(answered).length;
  const total = quizData.length;
  const pct = Math.round(done / total * 100);
  // optional visual if added
}

renderQuiz();
